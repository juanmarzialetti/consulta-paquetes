<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de paquete</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="card">

        <h1>Consulta de paquete</h1>

        <p>
            Ingresá tu código HC/TN 1 para saber si está disponible para retirar.
        </p>

        <input
            id="tracking"
            type="text"
            placeholder="Ej: HC336006167AR"
            autocomplete="off"
        >

        <button id="btnConsultar">
            Consultar
        </button>

        <div id="resultado"></div>

        <small>
            El código se encuentra en el aviso o comprobante del envío.
        </small>

    </main>

    <script src="app.js"></script>

</body>
</html>
